name: Deploy Pulse to GitHub Pages

# Publishes the static site to GitHub Pages.
# In your repo: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches:
      - main
      - claude/apple-watch-health-app-5ke74l
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on automatically if it isn't enabled yet, so there's
          # no manual Settings step (fixes "Get Pages site failed / Not Found").
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the site (static PWA, no build step).
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
